<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>App</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <!-- GitHub Pages serves this for unknown paths. Pinned apps live at
         pins/<id>/, which only the service worker knows about; on a first launch
         with empty storage (e.g. a new iPhone Home Screen app) the request reaches
         the server, so this page boots the pinned app itself. -->
    <style>
      html, body { margin: 0; height: 100%; background: Canvas; color: CanvasText; font: 15px/1.5 system-ui, sans-serif; }
      #frame { position: fixed; inset: 0; display: flex; }
      #frame iframe { flex: 1; border: 0; width: 100%; height: 100%; }
      #pin-ui { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
      .pin-card { pointer-events: auto; max-width: 520px; width: 100%; box-sizing: border-box; background: Canvas; color: CanvasText; border: 1px solid #8884; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px #0003; }
      .pin-card button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; margin: 8px 8px 0 0; }
      .pin-card button.primary { background: #2a78d6; color: #fff; border-color: transparent; }
      .missing { max-width: 480px; margin: 15vh auto; padding: 16px; text-align: center; }
    </style>
    <script>
      (function () {
        var m = location.pathname.match(/^(.*\/)pins\/([\w-]+)\/?/);
        if (!m) return;
        var root = m[1];
        var id = m[2];
        window.__PIN_ID = id;
        var base = document.createElement("base");
        base.href = root;
        document.head.prepend(base);
        var add = function (rel, href) {
          var l = document.createElement("link");
          l.rel = rel;
          l.href = "pins/" + id + "/" + href;
          document.head.append(l);
        };
        add("manifest", "manifest.webmanifest");
        add("apple-touch-icon", "icon-180.png");
      })();
    </script>
  </head>
  <body>
    <div id="frame"></div>
    <div id="pin-ui" aria-live="polite"></div>
    <div class="missing" id="missing" hidden>
      <h1>Page not found</h1>
      <p><a id="home" href="./">Open Local LLM Bench</a></p>
    </div>
    <script>
      if (window.__PIN_ID) {
        var s = document.createElement("script");
        s.type = "module";
        s.src = "js/core/pin-host.js";
        document.body.append(s);
      } else {
        document.getElementById("missing").hidden = false;
        var parts = location.pathname.split("/");
        document.getElementById("home").href = "/" + (parts[1] || "") + "/";
      }
    </script>
  </body>
</html>
