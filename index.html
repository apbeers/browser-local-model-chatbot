<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Local LLM Bench</title>
    <meta name="description" content="Chat with language models running fully on your device with WebGPU, measure their speed, and build your own version of the app." />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="LLM Bench" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Empty by default; custom UIs put extra styles here. -->
    <link rel="stylesheet" href="css/custom.css" />
    <!--
      This page is the locked boot shell: it can't be changed by custom UIs.
      It (1) applies the saved theme before anything renders, and (2) runs a
      startup watchdog: if the UI hasn't called app.ready() within 12 seconds,
      it offers to open the default UI. If that happens with a custom UI, the
      next normal launch switches back to the default automatically.
      Everything visible is rendered by js/ui/main.js into #root.
    -->
    <script>
      (function () {
        var ls = {};
        try {
          ls = window.localStorage;
          var t = ls.getItem("theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          var css = ls.getItem("paletteCSS");
          if (css) {
            var s = document.createElement("style");
            s.id = "custom-theme";
            s.textContent = css;
            document.head.appendChild(s);
            document.documentElement.dataset.palette = ls.getItem("palette");
          }
        } catch (e) {}
        var params = new URLSearchParams(location.search);
        window.__safe = params.has("safe");
        window.__previewUI = params.get("ui");
        var scope = new URL("./", location.href).href;

        function useDefaultUI() {
          if (!("caches" in window)) return Promise.resolve();
          return caches
            .open("ui-meta")
            .then(function (c) {
              return c.put(scope + "__ui/active", new Response('{"id":"default"}', { headers: { "content-type": "application/json" } }));
            })
            .catch(function () {});
        }
        window.__useDefaultUI = useDefaultUI;

        // Auto-rollback: the last launch of a custom UI never started.
        try {
          if (ls.getItem("uiBootFailed") === "1" && !window.__safe && !window.__previewUI) {
            ls.removeItem("uiBootFailed");
            ls.setItem("uiRolledBack", "1");
            useDefaultUI().then(function () {
              location.reload();
            });
            return;
          }
        } catch (e) {}

        var errors = [];
        window.addEventListener(
          "error",
          function (e) {
            if (!window.__appReady) errors.push((e.message || (e.target && e.target.src) || "error") + "");
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          if (!window.__appReady) errors.push(String(e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        var timer = setTimeout(function () {
          if (window.__appReady) return;
          var custom = !window.__safe;
          try {
            if (custom && !window.__previewUI) ls.setItem("uiBootFailed", "1");
          } catch (e) {}
          var box = document.createElement("div");
          box.setAttribute("role", "alertdialog");
          box.style.cssText =
            "position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5);font:15px/1.5 system-ui,sans-serif";
          box.innerHTML =
            '<div style="max-width:440px;background:#fff;color:#111;border-radius:12px;padding:20px">' +
            '<h2 style="margin:0 0 8px;font-size:18px">The app didn’t start</h2>' +
            '<p style="margin:0 0 12px">If you’re using a custom UI, it may have a bug. You can open the default UI; your chats and stats are safe.</p>' +
            '<pre id="boot-errors" style="white-space:pre-wrap;font-size:12px;background:#f3f3f3;padding:8px;border-radius:8px;max-height:120px;overflow:auto"></pre>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
            '<button id="boot-default" style="padding:8px 14px;border-radius:8px;border:0;background:#2a78d6;color:#fff">Open the default UI</button>' +
            '<a href="recover.html" style="padding:8px 14px">Recovery page</a>' +
            '<button id="boot-wait" style="padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff">Keep waiting</button></div></div>';
          document.body.appendChild(box);
          box.querySelector("#boot-errors").textContent = errors.slice(0, 5).join("\n") || "No error was reported; it may still be loading.";
          box.querySelector("#boot-default").onclick = function () {
            try {
              ls.removeItem("uiBootFailed");
            } catch (e) {}
            useDefaultUI().then(function () {
              location.href = scope;
            });
          };
          box.querySelector("#boot-wait").onclick = function () {
            box.remove();
          };
        }, 12000);
        window.__bootOk = function () {
          clearTimeout(timer);
          try {
            ls.removeItem("uiBootFailed");
          } catch (e) {}
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="js/ui/main.js"></script>
  </body>
</html>
