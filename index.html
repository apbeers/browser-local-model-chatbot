<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Local LLM Bench</title>
    <meta name="description" content="Chat with small language models running fully in your browser on WebGPU, and measure how fast they run on each device." />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="LLM Bench" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-head">
          <a class="brand" href="#/chat">
            <img src="icons/icon.svg" alt="" width="24" height="24" />
            <span>Local LLM Bench</span>
          </a>
          <button class="icon-btn only-mobile" id="close-sidebar" type="button" aria-label="Close menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <button class="btn btn-primary new-chat" id="new-chat" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          New chat
        </button>
        <nav class="nav">
          <a href="#/chat" data-nav="chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>Chat
          </a>
          <a href="#/models" data-nav="models">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4zM4 12l8 4 8-4M4 17l8 4 8-4" /></svg>Models
          </a>
          <a href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>Stats dashboard
          </a>
          <a href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></svg>Settings
          </a>
        </nav>
        <div class="sidebar-section-title">Conversations</div>
        <ul class="chat-list" id="chat-list" aria-label="Saved conversations"></ul>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="open-sidebar" type="button" aria-label="Open menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="topbar-title" id="topbar-title">Chat</div>
          <div class="model-bar" id="model-bar">
            <label class="sr-only" for="model-select">Model</label>
            <select id="model-select" class="select"></select>
            <button class="btn" id="load-btn" type="button">Load</button>
          </div>
          <button class="icon-btn" id="stats-toggle" type="button" aria-label="Toggle live stats" aria-pressed="true" title="Live stats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg>
          </button>
        </header>

        <section class="view view-chat" id="view-chat" data-view="chat">
          <div class="banner" id="banner" hidden></div>
          <div class="loadbar" id="loadbar" hidden>
            <div class="loadbar-text"><span id="load-text">Loading…</span><span id="load-pct"></span></div>
            <div class="progress"><div class="progress-fill" id="load-fill"></div></div>
          </div>
          <div class="stats-strip" id="stats-strip"></div>
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="composer" autocomplete="off">
            <div class="composer-inner">
              <label class="sr-only" for="prompt">Message</label>
              <textarea id="prompt" rows="1" placeholder="Message the model…" enterkeyhint="send"></textarea>
              <button class="send-btn" id="send-btn" type="submit" aria-label="Send">
                <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
                <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
              </button>
            </div>
            <div class="composer-hint" id="composer-hint">Runs entirely on this device. Nothing leaves your browser.</div>
          </form>
        </section>

        <section class="view view-page" id="view-models" data-view="models" hidden></section>
        <section class="view view-page" id="view-dashboard" data-view="dashboard" hidden></section>
        <section class="view view-page" id="view-settings" data-view="settings" hidden></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
