<!doctype html>
<html lang="en">
<head>
<title>Habit tracker</title>
<style>
  .chart { width: 100%; height: 180px; }
  .chart rect { fill: var(--accent); }
  .chart text { fill: var(--ink-2); font-size: 11px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  form .ak-input { flex: 1 1 140px; }
</style>
</head>
<body>
<main class="ak-app ak-stack">
  <header class="ak-header"><h1>Water tracker</h1></header>
  <section class="ak-grid">
    <div class="ak-card ak-stat"><b id="today">0</b><span>Glasses today</span></div>
    <div class="ak-card ak-stat"><b id="avg">0</b><span>Daily average (7 days)</span></div>
    <div class="ak-card ak-stat"><b id="streak">0</b><span>Day streak</span></div>
  </section>
  <form class="ak-card" id="form">
    <input class="ak-input" id="amount" type="number" min="1" value="1" aria-label="Amount">
    <button class="ak-btn primary">Log</button>
  </form>
  <section class="ak-card">
    <h2>Last 7 days</h2>
    <svg class="chart" id="chart" viewBox="0 0 700 180" preserveAspectRatio="none"></svg>
  </section>
</main>
<script>
  // Each entry: { at: timestamp, amount: number }
  let entries = [];
  const day = (t) => new Date(t).toISOString().slice(0, 10);

  function totalsLast7() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = day(Date.now() - i * 86400000);
      out.push({ d, total: entries.filter((e) => day(e.at) === d).reduce((s, e) => s + e.amount, 0) });
    }
    return out;
  }
  function render() {
    const week = totalsLast7();
    document.getElementById("today").textContent = week[6].total;
    document.getElementById("avg").textContent = (week.reduce((s, x) => s + x.total, 0) / 7).toFixed(1);
    let streak = 0;
    for (let i = 6; i >= 0 && week[i].total > 0; i--) streak++;
    document.getElementById("streak").textContent = streak;
    const max = Math.max(1, ...week.map((x) => x.total));
    const svg = document.getElementById("chart");
    svg.innerHTML = week.map((x, i) => {
      const h = (x.total / max) * 140;
      return `<rect x="${i * 100 + 20}" y="${150 - h}" width="60" height="${h}" rx="4"></rect>` +
        `<text x="${i * 100 + 50}" y="172" text-anchor="middle">${x.d.slice(5)}</text>`;
    }).join("");
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    entries.push({ at: Date.now(), amount: Number(document.getElementById("amount").value) || 1 });
    await appkit.storage.set("entries", entries);
    render();
  });
  appkit.storage.get("entries", []).then((saved) => { entries = saved; render(); });
</script>
</body>
</html>
