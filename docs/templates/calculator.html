<!doctype html>
<html lang="en">
<head>
<title>Tip calculator</title>
<style>
  .result b { font-size: 2.2rem; }
</style>
</head>
<body>
<main class="ak-app">
  <header class="ak-header"><h1>Tip calculator</h1></header>
  <div class="ak-split">
    <form class="ak-card ak-stack" id="form">
      <label class="ak-label">Bill amount <input class="ak-input" id="bill" type="number" min="0" step="0.01" value="50"></label>
      <label class="ak-label">Tip % <input class="ak-input" id="tip" type="number" min="0" step="1" value="18"></label>
      <label class="ak-label">People <input class="ak-input" id="people" type="number" min="1" step="1" value="2"></label>
    </form>
    <section class="ak-card ak-grid result">
      <div class="ak-stat"><b id="tip-total">0</b><span>Tip</span></div>
      <div class="ak-stat"><b id="total">0</b><span>Total</span></div>
      <div class="ak-stat"><b id="each">0</b><span>Each person</span></div>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const money = (n) => n.toLocaleString(undefined, { style: "currency", currency: "USD" });
  function update() {
    const bill = Number($("bill").value) || 0;
    const tip = bill * (Number($("tip").value) || 0) / 100;
    const people = Math.max(1, Number($("people").value) || 1);
    $("tip-total").textContent = money(tip);
    $("total").textContent = money(bill + tip);
    $("each").textContent = money((bill + tip) / people);
    appkit.storage.set("last", { bill, tip: $("tip").value, people });
  }
  $("form").addEventListener("input", update);
  appkit.storage.get("last").then((last) => {
    if (last) { $("bill").value = last.bill; $("tip").value = last.tip; $("people").value = last.people; }
    update();
  });
</script>
</body>
</html>
