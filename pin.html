<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Locked host page for a pinned Studio app. The service worker serves it
         at pins/<id>/ and replaces __PIN_ID__. <base> makes app files resolve
         from the site root. -->
    <base href="../../" />
    <title>App</title>
    <link rel="manifest" href="pins/__PIN_ID__/manifest.webmanifest" />
    <link rel="icon" href="pins/__PIN_ID__/icon-192.png" />
    <link rel="apple-touch-icon" href="pins/__PIN_ID__/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html, body { margin: 0; height: 100%; background: Canvas; color: CanvasText; font: 15px/1.5 system-ui, sans-serif; }
      #frame { position: fixed; inset: 0; display: flex; }
      #frame iframe { flex: 1; border: 0; width: 100%; height: 100%; }
      #pin-ui { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
      .pin-card { pointer-events: auto; max-width: 520px; width: 100%; box-sizing: border-box; background: Canvas; color: CanvasText; border: 1px solid #8884; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px #0003; }
      .pin-card button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; cursor: pointer; margin: 8px 8px 0 0; }
      .pin-card button.primary { background: #2a78d6; color: #fff; border-color: transparent; }
      .pin-card progress { width: 100%; }
    </style>
    <script>
      window.__PIN_ID = "__PIN_ID__";
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="frame"></div>
    <div id="pin-ui" aria-live="polite"></div>
    <script type="module" src="js/core/pin-host.js"></script>
  </body>
</html>
